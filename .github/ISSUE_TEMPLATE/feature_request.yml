name: Feature request
description: A model, runtime, GPU or command loadmaster should support.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The problem first, then the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A model (an `hf://` link), a GPU, or a command and the output you'd want.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
