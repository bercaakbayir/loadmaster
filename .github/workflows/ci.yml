name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Snapshot changes must be reviewed locally, never accepted in CI.
  INSTA_UPDATE: "no"
  # Runners occasionally lose DNS for a minute; retry crates.io downloads for longer.
  CARGO_NET_RETRY: "10"

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Download dependencies first, retrying across a short network outage, so a DNS
      # blip shows up as a retry here instead of a failed lint step.
      - name: Fetch dependencies
        shell: bash
        run: for i in 1 2 3; do cargo fetch --locked && exit 0; sleep 30; done; exit 1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo xtask check-deps
      - run: cargo xtask gen-fixtures --check

  # Windows support is new (v0.3) and not tested elsewhere: build and run the unit tests.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace --lib

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
