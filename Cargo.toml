[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bercaakbayir/loadmaster"
authors = ["Berca Akbayir <berca@ratel.sh>"]

[workspace.dependencies]
loadmaster-model = { path = "crates/loadmaster-model", version = "0.3.0" }
loadmaster-hw = { path = "crates/loadmaster-hw", version = "0.3.0" }
loadmaster-plan = { path = "crates/loadmaster-plan", version = "0.3.0" }
loadmaster-store = { path = "crates/loadmaster-store", version = "0.3.0" }
loadmaster-lock = { path = "crates/loadmaster-lock", version = "0.3.0" }
loadmaster-serve = { path = "crates/loadmaster-serve", version = "0.3.0" }
loadmaster-probe = { path = "crates/loadmaster-probe", version = "0.3.0" }

# See docs/decisions/0002-dependencies.md before adding or substituting.
anyhow = "1.0"
anstream = "1.0"
axum = "0.8"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
hyper = "1.12"
insta = "1.49"
minijinja = "3.0"
nvml-wrapper = "0.13"
proptest = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "blocking"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
yaml-rust2 = "0.13"
sha2 = "0.11"
nix = { version = "0.31", features = ["signal", "process"] }
jsonschema = { version = "0.59", default-features = false }
serde_json_path = "0.7"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
