# A typical single-GPU homelab config: shared macros, a coder MoE with expert offload,
# a vision model, an embedding model, and a vLLM model.
healthCheckTimeout: 120
globalTTL: 900
macros:
  "server": /opt/llama.cpp/build/bin/llama-server --host 127.0.0.1 --port ${PORT}
  "common": -fa on --jinja -np 1
  "models": /srv/models
models:
  "qwen3-coder":
    cmd: |
      ${server} ${common}
      -m ${models}/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
      -c 65536 -ngl 99 --n-cpu-moe 12
      -ctk q8_0 -ctv q8_0
      # sampling for code
      --temp 0.7 --top-p 0.8
    aliases: ["coder", "gpt-4o"]
    ttl: 0
  "gemma3-vision":
    cmd: >
      ${server} ${common}
      --model ${models}/gemma-3-12b-it-Q4_K_M.gguf
      --mmproj ${models}/mmproj-gemma-3-12b-it-F16.gguf
      --ctx-size=32768 -ngl 99
    aliases: ["vision"]
  "embed":
    cmd: ${server} -m ${models}/nomic-embed-text-v1.5.Q8_0.gguf --embedding -c 8192 -ngl 99
    ttl: 300
  "qwen3-awq":
    cmd: vllm serve Qwen/Qwen3-8B-AWQ --port ${PORT} --max-model-len 32768 --gpu-memory-utilization 0.85
groups:
  "always":
    persistent: true
    members: ["embed"]
