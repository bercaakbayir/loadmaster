# cargo-dist release config. After editing, run `dist generate` to (re)write
# .github/workflows/release.yml, then tag `vX.Y.Z` to release. See ADR 0006.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
# The Homebrew formula is pushed to this tap on release; it must exist and the release
# job needs a HOMEBREW_TAP_TOKEN secret with write access to it.
tap = "bercaakbayir/homebrew-tap"
publish-jobs = ["homebrew"]
formula = "loadmaster"
# glibc, not musl, on Linux: NVML is dlopen()ed at runtime (ADR 0006).
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Dependabot bumps the actions in release.yml; accept that instead of failing the release.
# The next `dist generate` rewrites the file anyway.
allow-dirty = ["ci"]
install-path = "CARGO_HOME"
install-updater = false

# dist 0.32 defaults Apple Silicon builds to macos-14, which GitHub no longer runs.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
