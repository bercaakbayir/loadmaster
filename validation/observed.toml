# Buffer sizes reported by llama.cpp (MiB) for real runs, used to check the planner.
# Each [[model]] names a file by sha256; a run lists the flags and what llama.cpp logged
# ("model buffer", "KV buffer", "compute buffer"; summed per device).
# Replay: cargo test -p loadmaster-plan --test observed -- --ignored --nocapture

[[model]]
name = "Llama 3.2 1B Instruct Q8_0"
sha256 = "74701a8c35f6c8d9a4b91f3f3497643001d63e0c7a84e085bed452548fa88d45"
# Where it may be on disk; the first existing path is used.
paths = ["~/.ollama/models/blobs/sha256-74701a8c35f6c8d9a4b91f3f3497643001d63e0c7a84e085bed452548fa88d45"]
llama_cpp = "0.7.0 (build 11669, commit 620d2225c), Homebrew"
device = "Apple M2, 8 GB, Metal"
observed_on = "2026-10-18"

