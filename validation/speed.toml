# Published llama.cpp token-generation results (llama-bench tg128, LLaMA 2 7B, 32 layers),
# with the device's peak memory bandwidth. `cargo test -p loadmaster-plan` checks that the
# speed estimate's band contains every one (crates/loadmaster-plan/src/speed.rs).
# Add points from `loadmaster report` runs as they arrive; see ADR 0009.
#
# Metal: https://github.com/ggml-org/llama.cpp/discussions/4167 (summary table, commit 8e672ef)
# CUDA:  https://github.com/ggml-org/llama.cpp/discussions/15013 (scoreboard)
# Model sizes from llama-bench: Q4_0 3.56 GiB, Q8_0 6.67 GiB, F16 12.55 GiB.

